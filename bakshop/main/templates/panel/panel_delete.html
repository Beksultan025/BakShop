{% extends "panel/panel_base.html" %}

{% block panel %}
<div class="auth auth--left">
  <h2 class="panel-sub">Удалить товар?</h2>
  <p>«{{ product.name }}» будет удалён без возможности восстановления.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn--wide">Да, удалить</button>
  </form>
  <p class="auth__alt"><a href="{% url 'panel_list' %}">Отмена</a></p>
</div>
{% endblock %}
