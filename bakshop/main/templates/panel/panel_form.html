{% extends "panel/panel_base.html" %}

{% block panel %}
<div class="auth auth--wide auth--left">
  <h2 class="panel-sub">{{ title }}</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn--wide">Сохранить</button>
  </form>
  <p class="auth__alt"><a href="{% url 'panel_list' %}">Назад к списку</a></p>
</div>
{% endblock %}
