{% extends "main/base.html" %}

{% block title %}Регистрация — BakShop{% endblock %}

{% block content %}
<main class="container">
  <div class="auth">
    <h1>Регистрация</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn--wide">Создать аккаунт</button>
    </form>
    <p class="auth__alt">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
  </div>
</main>
{% endblock %}
